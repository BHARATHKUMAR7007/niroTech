  <section class="gallery-section" id="gallery">
    <h2 class="gallery-title">Our Work Gallery</h2>
    <div class="gallery-container">
      <div class="gallery-item"><img src="images/handslag.jpg" alt="Project 1" onclick="openModal(0)" /></div>
      <div class="gallery-item"><img src="images/img1.jpeg" alt="Project 2" onclick="openModal(1)" /></div>
      <div class="gallery-item"><img src="images/img3.webp" alt="Project 3" onclick="openModal(2)" /></div>

    </div>

  <!-- Modal -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
    <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
    <a class="next" onclick="changeSlide(1)">&#10095;</a>
  </div>

  <script>
    const images = [
      "images/handslag.jpg",
      "images/img1.jpeg",
      "images/img3.webp",
      "images/img4.jpg",
      "images/logo.avif",
      "images/resdential.png"
    ];

    let currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      document.getElementById("imageModal").style.display = "block";
      document.getElementById("modalImage").src = images[currentIndex];
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }

    function changeSlide(step) {
      currentIndex = (currentIndex + step + images.length) % images.length;
      document.getElementById("modalImage").src = images[currentIndex];
    }
  </script>
